<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE1F7"/>
      <stop offset="1" stop-color="#EEF7FE"/>
    </linearGradient>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#8EC5EA" flood-opacity="0.35"/>
    </filter>
    <g id="nube">
      <ellipse cx="0" cy="0" rx="46" ry="26"/>
      <circle cx="-26" cy="-14" r="22"/>
      <circle cx="8" cy="-26" r="28"/>
      <circle cx="36" cy="-10" r="20"/>
    </g>
    <g id="brillo">
      <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z"/>
    </g>
  </defs>

  <rect width="1000" height="280" rx="24" fill="url(#cielo)"/>

  <!-- nubes de fondo -->
  <g fill="#FFFFFF" opacity="0.55">
    <use href="#nube" x="120" y="70" transform="scale(0.8)"/>
    <use href="#nube" x="1080" y="90" transform="scale(0.8)"/>
    <use href="#nube" x="560" y="40" transform="scale(0.6)"/>
  </g>

  <!-- nubes principales -->
  <g fill="#FFFFFF" filter="url(#sombra)">
    <use href="#nube" x="90" y="230"/>
    <use href="#nube" x="200" y="250" transform="translate(200 250) scale(0.75) translate(-200 -250)"/>
    <use href="#nube" x="900" y="220"/>
    <use href="#nube" x="800" y="255" transform="translate(800 255) scale(0.7) translate(-800 -255)"/>
  </g>

  <!-- brillitos -->
  <g fill="#FFFFFF">
    <use href="#brillo" x="300" y="60"/>
    <use href="#brillo" x="720" y="70"/>
    <use href="#brillo" x="860" y="120" transform="translate(860 120) scale(0.6) translate(-860 -120)"/>
    <use href="#brillo" x="150" y="140" transform="translate(150 140) scale(0.6) translate(-150 -140)"/>
  </g>
  <g fill="#F6C6D8">
    <use href="#brillo" x="640" y="215" transform="translate(640 215) scale(0.7) translate(-640 -215)"/>
    <use href="#brillo" x="360" y="225" transform="translate(360 225) scale(0.5) translate(-360 -225)"/>
  </g>

  <text x="500" y="128" text-anchor="middle" font-family="'Trebuchet MS', 'Verdana', 'Arial Rounded MT Bold', sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" stroke="#7FB5DE" stroke-width="10" stroke-linejoin="round" paint-order="stroke">Inés Llergo</text>
  <text x="500" y="176" text-anchor="middle" font-family="'Trebuchet MS', 'Verdana', sans-serif" font-size="20" fill="#5B8DB8" letter-spacing="1">Software Engineering @ UPAEP  ·  IBM SkillsBuild Ambassador</text>
</svg>
